<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог позиций</title>
<style id="st">
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f7f6f3;--surface:#ffffff;--text:#1d1d1b;--muted:#6b6a66;--border:#e4e2dc;
  --accent:#b45309;--accent-text:#ffffff;--danger:#b91c1c;--ok:#15803d;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413;--surface:#1e1e1c;--text:#f1efe9;--muted:#a19f97;--border:#33322f;
    --accent:#f59e0b;--accent-text:#1a1200;--danger:#f87171;--ok:#4ade80;--shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1e1e1c;--text:#f1efe9;--muted:#a19f97;--border:#33322f;
  --accent:#f59e0b;--accent-text:#1a1200;--danger:#f87171;--ok:#4ade80;--shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.topin{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{flex:1 1 200px;min-width:0}
.brand h1{margin:0;font-size:1.25rem;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.search{flex:1 1 220px;max-width:340px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.dng{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.875rem}
.btn.ghost{background:transparent}
main{padding-top:16px;padding-bottom:48px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}
.muted{color:var(--muted);font-size:.9rem}
.sortl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
select,input[type=text],input[type=number],textarea{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px 10px;width:100%}
.sortl select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card .pic{display:flex;align-items:center;justify-content:center;height:110px;font-size:3.2rem;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .cat{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card h3{margin:0;font-size:1.05rem}
.card .desc{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .price{margin-top:auto;padding-top:8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card.off{opacity:.6}
.badge{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:currentColor}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:16px 0 24px}
/* admin */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;margin-bottom:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.bar .st{flex:1 1 200px;font-size:.9rem}
.bar .st.dirty{color:var(--accent);font-weight:600}
.panel{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:1.05rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label.f.full{grid-column:1/-1}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
.row .em{font-size:1.6rem;min-width:2rem;text-align:center;display:flex;align-items:center;justify-content:center}
.th{width:48px;height:48px;object-fit:cover;border-radius:8px;display:block}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.dlg .ph{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block}
.prev{min-height:60px;display:flex;align-items:center}
.prevpic{max-width:100%;max-height:200px;border-radius:10px;border:1px solid var(--border)}
.row .tt{flex:1 1 160px;min-width:0}
.row .tt b{display:block}
.row .tt span{color:var(--muted);font-size:.85rem}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:.85rem;color:var(--muted);margin:10px 0 0}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg h2{margin:0 0 12px;font-size:1.2rem}
.dlg .big{font-size:4rem;text-align:center;margin:4px 0 8px}
.dlg .pr{font-size:1.4rem;font-weight:700;margin:8px 0}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.err{color:var(--danger);font-size:.85rem;margin-top:8px;min-height:1.2em}
.tgnote{color:var(--muted);font-size:.85rem;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs .tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.tabs .tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.utable{width:100%;border-collapse:collapse;font-size:.9rem}
.utable th,.utable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.utable th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase}
.uid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="site-data">{"settings":{"title":"Каталог позиций","subtitle":"Выберите то, что вам нужно","currency":"₽"},"items":[{"id":"i1","title":"Эспрессо","category":"Напитки","price":150,"desc":"Крепкий классический эспрессо из свежей обжарки.","emoji":"☕","available":true},{"id":"i2","title":"Матча-латте","category":"Напитки","price":260,"desc":"Японская матча с тёплым молоком.","emoji":"🍵","available":true},{"id":"i3","title":"Свежевыжатый сок","category":"Напитки","price":240,"desc":"Апельсин или яблоко на выбор.","emoji":"🧃","available":true},{"id":"i4","title":"Круассан","category":"Выпечка","price":150,"desc":"Слоёный круассан со сливочным маслом.","emoji":"🥐","available":true},{"id":"i5","title":"Чизкейк","category":"Десерты","price":290,"desc":"Нежный чизкейк Нью-Йорк с ягодным соусом.","emoji":"🍰","available":true},{"id":"i6","title":"Брауни","category":"Десерты","price":210,"desc":"Шоколадный брауни с грецким орехом.","emoji":"🍫","available":false},{"id":"i7","title":"Салат Цезарь","category":"Основное","price":420,"desc":"Курица, романо, пармезан, соус цезарь, сухарики.","emoji":"🥗","available":true},{"id":"i8","title":"Паста карбонара","category":"Основное","price":480,"desc":"Спагетти, бекон, желток, пекорино.","emoji":"🍝","available":true}]}</script>
<script id="code">
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('site-data').textContent);
var PW_HASH = 'b1e5f0f26aeae57299d396c03f0f7fe74f7fa000421cfc03318696bb8d2721b2';
var S = {tg:'', tgId:'', nick:'', regMode:'register', captcha:null, unlocked:false, fails:0, lockUntil:0, mode:'catalog', atab:'items', users:[], db:null, usersSub:false, regMandatory:false, q:'', cat:'Все', sort:'default', draft:null, dirty:false, canEdit:null, artifact:null, saving:false, confirmDel:null};
var $root = document.getElementById('root');
var $modal = document.getElementById('modal');
var $toast = document.getElementById('toast');
var toastT = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function cur(){ return (S.mode === 'admin' ? S.draft : DATA).settings.currency || ''; }
function money(n){ return (Number(n) || 0).toLocaleString('ru-RU', {maximumFractionDigits:2}) + (cur() ? '\u00a0' + cur() : ''); }
function toast(t){ $toast.textContent = t; $toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ $toast.classList.remove('show'); }, 3200); }
function uid(){ return Date.now().toString() + Math.floor(100 + Math.random() * 900).toString(); }
function loadTgId(){ try { return sessionStorage.getItem('tgId') || localStorage.getItem('tgId') || ''; } catch (e) { return ''; } }
function saveTgId(v){ try { sessionStorage.setItem('tgId', v); localStorage.setItem('tgId', v); } catch (e) {} }
function localUsersLoad(){ try { return JSON.parse(localStorage.getItem('siteUsers') || '[]'); } catch (e) { return []; } }
function localUsersSave(list){ try { localStorage.setItem('siteUsers', JSON.stringify(list)); } catch (e) {} }
function registerUser(tg, nick, id, pwHash){
  var l = localUsersLoad();
  var i = -1; for (var k = 0; k < l.length; k++) if (l[k].id === id) { i = k; break; }
  var prevPurchases = i >= 0 ? (l[i].purchases || []) : [];
  var rec = {id: id, tg: tg, nick: nick, ts: Date.now(), purchases: prevPurchases, pw: pwHash};
  if (S.db) { try { S.db.collection('users').doc(id).set(rec).catch(function(){}); } catch (e) {} }
  if (i >= 0) l[i] = rec; else l.push(rec);
  localUsersSave(l); S.users = l;
}
function addPurchase(itemId, title){
  if (!S.tgId) return;
  var l = localUsersLoad();
  var i = -1; for (var k = 0; k < l.length; k++) if (l[k].id === S.tgId) { i = k; break; }
  if (i < 0) return;
  l[i].purchases = l[i].purchases || [];
  l[i].purchases.push({itemId: itemId, title: title, ts: Date.now()});
  localUsersSave(l); S.users = l;
  if (S.db) { try { S.db.collection('users').doc(S.tgId).update({purchases: l[i].purchases}).catch(function(){}); } catch (e) {} }
}
function watchUsers(){
  if (S.db && !S.usersSub) {
    S.usersSub = true;
    try {
      S.db.collection('users').onSnapshot(function(list){
        S.users = (list || []).slice().sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
        if (S.mode === 'admin' && S.atab === 'users') renderUsersTab();
      });
    } catch (e) {}
  }
}
function loadAdmLock(){
  try { var v = JSON.parse(localStorage.getItem('admLock') || '{}'); return {fails: v.fails || 0, lockUntil: v.lockUntil || 0}; }
  catch (e) { return {fails: 0, lockUntil: 0}; }
}
function saveAdmLock(){ try { localStorage.setItem('admLock', JSON.stringify({fails: S.fails, lockUntil: S.lockUntil})); } catch (e) {} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var pendingImg = '';
var regAfter = '';
function loadTg(){ try { return sessionStorage.getItem('tgUser') || localStorage.getItem('tgUser') || ''; } catch (e) { return ''; } }
function saveTg(v){ try { sessionStorage.setItem('tgUser', v); localStorage.setItem('tgUser', v); } catch (e) {} }
function loadNick(){ try { return sessionStorage.getItem('nick') || localStorage.getItem('nick') || ''; } catch (e) { return ''; } }
function saveNick(v){ try { sessionStorage.setItem('nick', v); localStorage.setItem('nick', v); } catch (e) {} }
function validNick(v){ v = v.trim(); return v.length >= 2 && v.length <= 30; }
function loadRegLog(){ try { return JSON.parse(localStorage.getItem('regLog') || '[]'); } catch (e) { return []; } }
function pushRegLog(){
  var l = loadRegLog(); var now = Date.now();
  l = l.filter(function(t){ return now - t < 3600000; });
  l.push(now);
  try { localStorage.setItem('regLog', JSON.stringify(l)); } catch (e) {}
}
function regNeedsCaptcha(){
  var l = loadRegLog(); var now = Date.now();
  return l.filter(function(t){ return now - t < 1800000; }).length >= 2;
}
function newCaptcha(){
  var a = 1 + Math.floor(Math.random() * 9), b = 1 + Math.floor(Math.random() * 9);
  S.captcha = {a: a, b: b};
}
function findUserByTg(tg){
  var l = localUsersLoad();
  for (var k = 0; k < l.length; k++) if (l[k].tg === tg) return l[k];
  return null;
}
function validTg(v){ return /^@[a-zA-Z0-9_]{5,32}$/.test(v); }
function normTg(v){ v = v.trim(); if (v && v[0] !== '@') v = '@' + v; return v; }
function safeImg(u){ return (typeof u === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(u)) ? u : ''; }
function fileToDataUrl(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('read')); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ rej(new Error('decode')); };
      im.onload = function(){
        var max = 800, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function renderPrev(){
  var p = $('f-prev'); if (!p) return;
  p.innerHTML = pendingImg ? '<img class="prevpic" src="' + esc(pendingImg) + '" alt="">' : '<span class="muted">Фото не выбрано — будет показан значок</span>';
  var r = $('f-rm'); if (r) r.style.display = pendingImg ? '' : 'none';
}
function findIn(list, id){ for (var i = 0; i < list.length; i++) if (list[i].id === id) return i; return -1; }

/* ---------- шаблон страницы для публикации (из собственных статичных частей) ---------- */
function buildDoc(d){
  var css = document.getElementById('st').textContent;
  var js = document.getElementById('code').textContent;
  var data = JSON.stringify(d).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    '<title>' + esc(d.settings.title) + '</title>\n' +
    '<style id="st">' + css + '</style>\n</head>\n<body>\n' +
    '<div id="root"></div>\n<div id="modal"></div>\n<div id="toast" role="status" aria-live="polite"></div>\n' +
    '<script type="application/json" id="site-data">' + data + '<\/script>\n' +
    '<script id="code">' + js + '<\/script>\n</body>\n</html>';
}

/* ---------- публичный каталог ---------- */
function headHTML(){
  var d = S.mode === 'admin' ? S.draft : DATA;
  var admin = S.mode === 'admin';
  return '<header class="top"><div class="wrap topin">' +
    '<div class="brand"><h1>' + esc(d.settings.title) + '</h1><p>' + esc(d.settings.subtitle) + '</p></div>' +
    (admin ? '' : '<input id="q" class="search" type="search" placeholder="Поиск по позициям…" aria-label="Поиск" value="' + esc(S.q) + '">') +
    (!admin && S.tg ? '<span class="muted" style="white-space:nowrap;display:flex;align-items:center;gap:8px">👤 ' + esc(S.nick || S.tg) + ' <button class="btn sm ghost" data-a="profile">Профиль</button><button class="btn sm ghost" data-a="tg-logout">Выйти</button></span>' : '') +
    (admin ? '<button id="abtn" class="btn ghost" data-a="exit-admin">← К каталогу</button>' : '') +
    '</div></header>';
}
function catalogHTML(){
  return '<main class="wrap"><div id="chips" class="chips"></div>' +
    '<div class="tools"><span id="count" class="muted"></span>' +
    '<label class="sortl">Сортировка <select id="sort">' +
    '<option value="default">По умолчанию</option><option value="name">По названию</option>' +
    '<option value="asc">Сначала дешёвые</option><option value="desc">Сначала дорогие</option></select></label></div>' +
    '<div id="grid" class="grid"></div></main>';
}
function card(i){
  return '<button class="card' + (i.available ? '' : ' off') + '" data-a="view" data-id="' + esc(i.id) + '">' +
    '<div class="pic">' + (safeImg(i.img) ? '<img src="' + esc(safeImg(i.img)) + '" alt="' + esc(i.title) + '" loading="lazy">' : '<span aria-hidden="true">' + esc(i.emoji || '📦') + '</span>') + '</div>' +
    '<div class="body"><span class="cat">' + esc(i.category) + '</span><h3>' + esc(i.title) + '</h3>' +
    '<span class="desc">' + esc(i.desc) + '</span>' +
    '<div class="price"><span>' + money(i.price) + '</span><span class="badge' + (i.available ? ' ok' : '') + '">' + (i.available ? 'В наличии' : 'Нет в наличии') + '</span></div></div></button>';
}
function renderList(){
  var items = DATA.items;
  var seen = {}, cats = ['Все'];
  items.forEach(function(i){ if (i.category && !seen[i.category]) { seen[i.category] = 1; cats.push(i.category); } });
  if (cats.indexOf(S.cat) < 0) S.cat = 'Все';
  $('chips').innerHTML = cats.map(function(c){
    return '<button class="chip' + (c === S.cat ? ' on' : '') + '" data-a="cat" data-v="' + esc(c) + '">' + esc(c) + '</button>';
  }).join('');
  var q = S.q.trim().toLowerCase();
  var l = items.filter(function(i){
    return (S.cat === 'Все' || i.category === S.cat) &&
      (!q || (i.title + ' ' + i.desc + ' ' + i.category).toLowerCase().indexOf(q) >= 0);
  });
  if (S.sort === 'asc') l = l.slice().sort(function(a, b){ return a.price - b.price; });
  else if (S.sort === 'desc') l = l.slice().sort(function(a, b){ return b.price - a.price; });
  else if (S.sort === 'name') l = l.slice().sort(function(a, b){ return a.title.localeCompare(b.title, 'ru'); });
  $('count').textContent = 'Найдено: ' + l.length;
  $('sort').value = S.sort;
  $('grid').innerHTML = l.length ? l.map(card).join('') :
    '<div class="empty">' + (items.length ? 'Ничего не найдено' : 'Пока нет ни одной позиции') + '</div>';
}

/* ---------- админ-панель ---------- */
function adminHTML(){
  var s = S.draft.settings;
  return '<main class="wrap">' +
    '<div class="tabs">' +
    '<button class="tab' + (S.atab === 'items' ? ' on' : '') + '" data-a="atab" data-v="items">Позиции</button>' +
    '<button class="tab' + (S.atab === 'users' ? ' on' : '') + '" data-a="atab" data-v="users">Пользователи</button>' +
    '</div>' +
    (S.atab === 'items' ?

async function submitReg(afterId){
  afterId = afterId || regAfter;
  var f = $('tg-in'), er = $('tgerr'), pw1 = $('pw1-in');
  if (!f || !pw1) return;
  var v = normTg(f.value);
  if (!validTg(v)) { er.textContent = 'Введите корректный юзернейм, например @ivan_petrov.'; return; }
  var pass = pw1.value;
  if (S.regMode === 'login') {
    if (!pass) { er.textContent = 'Введите пароль.'; return; }
    var existing = findUserByTg(v);
    if (!existing) { er.textContent = 'Аккаунт с таким юзернеймом не найден на этом устройстве.'; return; }
    var h;
    try { h = await sha256(pass); } catch (e) { er.textContent = 'Проверка пароля недоступна в этом браузере.'; return; }
    if (h !== existing.pw) { er.textContent = 'Неверный пароль.'; return; }
    S.tg = existing.tg; saveTg(existing.tg);
    S.nick = existing.nick; saveNick(existing.nick);
    S.tgId = existing.id; saveTgId(existing.id);
    closeModal(); render();
    toast('С возвращением, ' + existing.nick + '!');
    if (afterId) viewModal(afterId);
    return;
  }
  var nf = $('nick-in');
  if (!nf) return;
  var nick = nf.value.trim();
  if (!validNick(nick)) { er.textContent = 'Введите никнейм от 2 до 30 символов.'; return; }
  if (findUserByTg(v)) { er.textContent = 'Этот юзернейм уже зарегистрирован. Нажмите «Войти».'; return; }
  if (pass.length < 6) { er.textContent = 'Пароль должен быть не короче 6 символов.'; return; }
  var pw2 = $('pw2-in');
  if (!pw2 || pass !== pw2.value) { er.textContent = 'Пароли не совпадают.'; return; }
  if (S.captcha) {
    var cap = $('cap-in');
    if (!cap || parseInt(cap.value, 10) !== S.captcha.a + S.captcha.b) { er.textContent = 'Неверный ответ на проверку. Попробуйте ещё раз.'; newCaptcha(); regModal(afterId, S.regMandatory); return; }
  }
  var hash;
  try { hash = await sha256(pass); } catch (e) { er.textContent = 'Регистрация недоступна в этом браузере.'; return; }
  S.tg = v; saveTg(v);
  S.nick = nick; saveNick(nick);
  S.tgId = uid(); saveTgId(S.tgId);
  registerUser(v, nick, S.tgId, hash);
  pushRegLog();
  closeModal();
  render();
  toast('Добро пожаловать, ' + nick + '!');
  if (afterId) viewModal(afterId);
}

/* ---------- права доступа и публикация ---------- */
function setBtn(){ /* публичной кнопки входа в админку больше нет — доступ только по отдельной ссылке #admin */ }
async function sha256(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.prototype.map.call(new Uint8Array(buf), function(x){ return x.toString(16).padStart(2, '0'); }).join('');
}
function enterAdmin(){
  S.draft = clone(DATA); S.dirty = false; S.confirmDel = null; S.mode = 'admin'; render(); window.scrollTo(0, 0);
}
function lockText(ms){
  var s = Math.ceil(ms / 1000);
  if (s < 60) return s + ' с';
  var m = Math.ceil(s / 60);
  if (m < 60) return m + ' мин';
  var h = Math.ceil(m / 60);
  return h + ' ч';
}
function openAdmin(){
  try { if (sessionStorage.getItem('adm') === '1') S.unlocked = true; } catch (e) {}
  var l = loadAdmLock(); S.fails = l.fails; S.lockUntil = l.lockUntil;
  if (S.unlocked) { closeModal(); enterAdmin(); return; }
  var wait = S.lockUntil - Date.now();
  showModal('<h2>Вход в админ-панель</h2>' +
    (wait > 0 ? '<p class="err">Слишком много попыток. Попробуйте снова через ' + lockText(wait) + '.</p>' : '') +
    '<label class="f">Пароль<input type="password" id="pw" autocomplete="current-password"' + (wait > 0 ? ' disabled' : '') + '></label>' +
    '<div class="err" id="pwerr"></div>' +
    '<div class="btns"><button class="btn" data-a="close">Отмена</button><button class="btn pri" data-a="login"' + (wait > 0 ? ' disabled' : '') + '>Войти</button></div>');
  setTimeout(function(){ var f = $('pw'); if (f && !f.disabled) f.focus(); }, 0);
}
async function login(){
  var err = $('pwerr'), inp = $('pw');
  if (!inp) return;
  var wait = S.lockUntil - Date.now();
  if (wait > 0) { err.textContent = 'Слишком много попыток. Подождите ещё ' + lockText(wait) + '.'; return; }
  var h;
  try { h = await sha256(inp.value); }
  catch (e) { err.textContent = 'Проверка пароля недоступна в этом браузере.'; return; }
  if (h === PW_HASH) {
    S.unlocked = true; S.fails = 0; S.lockUntil = 0; saveAdmLock();
    try { sessionStorage.setItem('adm', '1'); } catch (e) {}
    closeModal(); enterAdmin();
  } else {
    S.fails++;
    if (S.fails >= 3) {
      S.lockUntil = Date.now() + 3600000; S.fails = 0; saveAdmLock();
      err.textContent = 'Слишком много попыток. Вход заблокирован на 1 час.';
      inp.disabled = true;
      var b = document.querySelector('[data-a="login"]'); if (b) b.disabled = true;
    } else {
      saveAdmLock();
      err.textContent = 'Неверный пароль. Осталось попыток: ' + (3 - S.fails) + '.';
    }
    inp.select();
  }
}
function exitAdmin(){
  if (S.dirty && !window.__leaveOk) {
    showModal('<h2>Выйти без сохранения?</h2><p>Неопубликованные изменения будут потеряны.</p>' +
      '<div class="btns"><button class="btn" data-a="close">Остаться</button><button class="btn dng" data-a="leave">Выйти</button></div>');
    return;
  }
  leave();
}
function leave(){ closeModal(); S.mode = 'catalog'; S.draft = null; S.dirty = false; render(); }
function errText(e){
  var c = e && e.code;
  if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required') return 'Нет прав на редактирование этого сайта.';
  if (c === 'rate_limited') return 'Слишком часто. Подождите немного и повторите.';
  if (c === 'too_large') return 'Страница стала слишком тяжёлой: уберите часть фото или используйте меньшие.';
  return 'Не удалось опубликовать. Попробуйте ещё раз.';
}
function publish(){
  if (!S.artifact) { toast('Публикация недоступна в этом окне. Откройте сайт в claude.ai.'); return; }
  S.draft.settings.title = $('s-title').value.trim() || 'Каталог';
  S.draft.settings.subtitle = $('s-sub').value.trim();
  S.draft.settings.currency = $('s-cur').value.trim();
  S.saving = true; updateBar();
  S.artifact.publish(buildDoc(S.draft)).catch(function(e){
    S.saving = false; updateBar();
    if (e && e.code === 'conflict') return; // страница сама перезагрузится на свежую версию
    toast(errText(e));
  });
}

/* ---------- рендер и события ---------- */
function render(){
  $root.innerHTML = headHTML() + (S.mode === 'admin' ? adminHTML() : catalogHTML());
  if (S.mode === 'admin') {
    if (S.atab === 'items') { renderAdminList(); updateBar(); } else { watchUsers(); renderUsersTab(); }
  } else { renderList(); }
  setBtn();
}

document.addEventListener('click', function(e){
  var t = e.target;
  if (t.getAttribute && t.getAttribute('data-ov') && t === t) { closeModal(); return; }
  var el = t.closest ? t.closest('[data-a]') : null;
  if (!el) return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (a === 'reg-toggle') { e.preventDefault(); S.regMode = S.regMode === 'login' ? 'register' : 'login'; regModal(regAfter, S.regMandatory); return; }
  if (a === 'cat') { S.cat = el.getAttribute('data-v'); renderList(); }
  else if (a === 'view') { if (!S.tg) { regModal(id, true); } else { viewModal(id); } }
  else if (a === 'close') closeModal();
  else if (a === 'reg-save') submitReg(id);
  else if (a === 'profile') profileModal();
  else if (a === 'pick') { var pi = DATA.items[findIn(DATA.items, id)]; if (pi) { addPurchase(id, pi.title); closeModal(); toast('Добавлено в ваш профиль: ' + pi.title); } }
  else if (a === 'atab') { S.atab = el.getAttribute('data-v'); render(); }
  else if (a === 'tg-logout') { S.tg = ''; S.regMode = 'login'; try { sessionStorage.removeItem('tgUser'); localStorage.removeItem('tgUser'); } catch (e) {} render(); toast('Вы вышли'); regModal(null, true); }
  else if (a === 'open-admin') openAdmin();
  else if (a === 'login') login();
  else if (a === 'exit-admin') exitAdmin();
  else if (a === 'leave') leave();
  else if (a === 'add') itemModal(null);
  else if (a === 'edit') itemModal(id);
  else if (a === 'save-item') saveItem(id);
  else if (a === 'rm-img') { pendingImg = ''; renderPrev(); }
  else if (a === 'publish') publish();
  else if (a === 'discard') { S.draft = clone(DATA); S.dirty = false; render(); toast('Изменения отменены'); }
  else if (a === 'up' || a === 'down') {
    var n = findIn(S.draft.items, id), m = a === 'up' ? n - 1 : n + 1;
    if (n >= 0 && m >= 0 && m < S.draft.items.length) {
      var tmp = S.draft.items[n]; S.draft.items[n] = S.draft.items[m]; S.draft.items[m] = tmp;
      renderAdminList(); markDirty();
    }
  }
  else if (a === 'del') {
    if (S.confirmDel === id) {
      S.draft.items.splice(findIn(S.draft.items, id), 1); S.confirmDel = null; renderAdminList(); markDirty();
    } else {
      S.confirmDel = id; renderAdminList();
      setTimeout(function(){ if (S.confirmDel === id) { S.confirmDel = null; if (S.mode === 'admin') renderAdminList(); } }, 3000);
    }
  }
});
$modal.addEventListener('click', function(e){ if (e.target.classList && e.target.classList.contains('ov') && !S.regMandatory) closeModal(); });
document.addEventListener('input', function(e){
  var id = e.target.id;
  if (id === 'q') { S.q = e.target.value; renderList(); }
  else if (id === 's-title' || id === 's-sub' || id === 's-cur') markDirty();
});
document.addEventListener('change', function(e){
  if (e.target.id === 'sort') { S.sort = e.target.value; renderList(); }
  if (e.target.id === 'f-file') {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var er = $('ferr');
    if (!/^image\//.test(f.type)) { er.textContent = 'Выберите файл-изображение.'; e.target.value = ''; return; }
    er.textContent = 'Обрабатываем фото…';
    fileToDataUrl(f).then(function(u){ pendingImg = u; renderPrev(); if ($('ferr')) $('ferr').textContent = ''; })
      .catch(function(){ if ($('ferr')) $('ferr').textContent = 'Не удалось прочитать это изображение. Попробуйте JPG или PNG.'; });
    e.target.value = '';
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !S.regMandatory) closeModal();
  if (e.key === 'Enter' && e.target && e.target.id === 'pw') login();
  if (e.key === 'Enter' && e.target && ['tg-in','nick-in','pw1-in','pw2-in','cap-in'].indexOf(e.target.id) >= 0) submitReg();
});

S.tg = loadTg(); S.tgId = loadTgId(); S.nick = loadNick(); S.users = localUsersLoad();
render();
if (!S.tg) { regModal(null, true); }
if (location.hash === '#admin') openAdmin();
window.addEventListener('hashchange', function(){ if (location.hash === '#admin' && S.mode !== 'admin') openAdmin(); });

/* определяем права: панель открывается только тем, кто может редактировать этот сайт */
(async function(){
  try {
    if (window.claude && window.claude.use) {
      var u = await window.claude.use('user');
      S.canEdit = u ? !!u.canEdit() : false;
      S.artifact = await window.claude.use('artifact');
      S.db = await window.claude.use('db');
      if (S.db) watchUsers();
    } else { S.canEdit = false; }
  } catch (err) { S.canEdit = false; }
  setBtn();
})();
})();
</script>
</body>
</html>
